<!doctype html>
<html lang="en" data-composition-variables='[
  {"id": "title", "type": "string", "label": "Title", "default": "Hello"},
  {"id": "subtitle", "type": "string", "label": "Subtitle", "default": "What we will make together"},
  {"id": "color", "type": "color", "label": "Color", "default": "#b45309"}
]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff7ed; }
      #root { width: 100%; height: 100%; position: relative; font-family: system-ui, sans-serif; text-align: center; }
      .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 0 96px; }
      #title { font-size: 120px; line-height: 1.1; font-weight: 700; color: #b45309; }
      #subtitle { font-size: 48px; color: #57534e; }
      #bar { position: absolute; left: 0; bottom: 0; height: 20px; width: 100%; background: #b45309; transform-origin: left; transform: scaleX(0); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="card" class="card clip" data-start="0" data-duration="6" data-track-index="0">
        <h1 id="title">Hello</h1>
        <p id="subtitle">What we will make together</p>
      </div>
      <div id="bar" class="clip" data-start="0" data-duration="6" data-track-index="1"></div>
      <!-- Music or a voice, a file in this folder:
      <audio id="music" src="music.mp3" data-start="0" data-duration="6" data-volume="0.6" data-fade-out="1"></audio>
      -->
    </div>
    <script>
      const variables = window.__hyperframes ? window.__hyperframes.getVariables() : {};
      if (variables.title) document.getElementById("title").textContent = variables.title;
      if (variables.subtitle) document.getElementById("subtitle").textContent = variables.subtitle;
      if (variables.color) {
        document.getElementById("title").style.color = variables.color;
        document.getElementById("bar").style.background = variables.color;
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 1.2, ease: "elastic.out(1, 0.6)" }, 0);
      tl.fromTo("#subtitle", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.8);
      tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 6, ease: "none" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
